<section class="py-5">
  <div class="container">
    <h4 class="fw-bold text-center mb-4">Popüler Kategoriler</h4>
    <div class="row g-3 justify-content-center">
      @for (category of categories(); track category.id) {
        <div class="col-6 col-md-4 col-lg-2">
          <a [routerLink]="['/kategori', category.slug]" class="text-decoration-none">
            <div class="card category-card text-center border-0 p-3">
              <div class="category-card__icon mx-auto mb-2 d-flex align-items-center justify-content-center rounded-circle bg-light"
                   style="width: 72px; height: 72px;">
                <i class="bi {{ category.icon }} fs-3 text-primary"></i>
              </div>
              <span class="small fw-medium text-dark">{{ category.name }}</span>
            </div>
          </a>
        </div>
      }
    </div>
  </div>
</section>
