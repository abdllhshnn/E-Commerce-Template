<!-- Katman 1: Top Bar -->
<div class="header-top-bar bg-dark text-white py-1">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="small">Hoş geldiniz!</span>
    <div class="d-flex gap-3">
      <a routerLink="/yardim" class="text-white text-decoration-none small">Yardım</a>
      <a routerLink="/siparis-takibi" class="text-white text-decoration-none small">Sipariş Takibi</a>
      <a routerLink="/hesabim" class="text-white text-decoration-none small">Hesabım</a>
    </div>
  </div>
</div>

<!-- Katman 2: Main Bar -->
<div class="header-main-bar bg-white border-bottom py-3">
  <div class="container d-flex align-items-center justify-content-between gap-4">
    <!-- Logo -->
    <a routerLink="/" class="text-decoration-none">
      <h4 class="mb-0 fw-bold text-primary">E-Ticaret</h4>
    </a>

    <!-- Arama -->
    <div class="header-search flex-grow-1">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Ürün, kategori veya marka ara...">
        <button class="btn btn-primary" type="button">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <!-- İkonlar -->
    <div class="d-flex align-items-center gap-3">
      <a routerLink="/hesabim" class="text-dark text-decoration-none">
        <i class="bi bi-person fs-5"></i>
      </a>
      <a routerLink="/favoriler" class="text-dark text-decoration-none">
        <i class="bi bi-heart fs-5"></i>
      </a>
      <a routerLink="/sepet" class="text-dark text-decoration-none position-relative">
        <i class="bi bi-cart3 fs-5"></i>
        @if (cartCount > 0) {
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{ cartCount }}
          </span>
        }
      </a>
    </div>
  </div>
</div>

<!-- Katman 3: Kategori Nav -->
<nav class="header-category-nav bg-light border-bottom">
  <div class="container">
    <ul class="nav gap-1 py-2">
      @for (category of categories(); track category.id) {
        <li class="nav-item">
          <a class="nav-link text-dark px-3 py-1 rounded" [routerLink]="['/kategori', category.slug]">
            <i class="bi {{ category.icon }} me-1"></i> {{ category.name }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
