<div class="container py-4">
  <div class="row g-4">
    <!-- Sidebar -->
    <div class="col-lg-3">
      <aside class="account__sidebar">
        <!-- User Info -->
        <div class="account__user-info">
          <div class="account__avatar">{{ initials }}</div>
          <h6 class="account__user-name">{{ fullName }}</h6>
          <small class="account__user-email">{{ email }}</small>
        </div>

        <!-- Navigation -->
        <nav class="account__nav">
          <a routerLink="/account"
             [routerLinkActiveOptions]="{ exact: true }"
             routerLinkActive="account__nav-link--active"
             class="account__nav-link">
            <i class="bi bi-grid"></i> Dashboard
          </a>
          <a routerLink="/account/orders"
             routerLinkActive="account__nav-link--active"
             class="account__nav-link">
            <i class="bi bi-box-seam"></i> Siparişlerim
          </a>
          <a routerLink="/account/addresses"
             routerLinkActive="account__nav-link--active"
             class="account__nav-link">
            <i class="bi bi-geo-alt"></i> Adreslerim
          </a>
          <a routerLink="/account/favorites"
             routerLinkActive="account__nav-link--active"
             class="account__nav-link">
            <i class="bi bi-heart"></i> Favorilerim
          </a>
          <a routerLink="/account/settings"
             routerLinkActive="account__nav-link--active"
             class="account__nav-link">
            <i class="bi bi-gear"></i> Ayarlar
          </a>
        </nav>

        <!-- Logout -->
        <button type="button" class="account__logout-btn" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i> Çıkış Yap
        </button>
      </aside>
    </div>

    <!-- Content -->
    <div class="col-lg-9">
      <router-outlet />
    </div>
  </div>
</div>
