<h4 class="mb-3 fw-bold">Favorilerim</h4>

@if (favorites().length > 0) {
  <div class="row g-3">
    @for (product of favorites(); track product.id) {
      <div class="col-6 col-md-4 col-lg-3">
        <app-product-card
          [product]="product"
          (favoriteToggled)="onFavoriteToggled($event)" />
      </div>
    }
  </div>
} @else {
  <div class="text-center py-5">
    <i class="bi bi-heart text-muted" style="font-size: 3rem;"></i>
    <p class="text-muted mt-3">Favori listeniz boş.</p>
    <p class="text-muted small">Beğendiğiniz ürünleri favorilere ekleyerek kolayca takip edin.</p>
  </div>
}
